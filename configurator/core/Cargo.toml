[package]
name = "greyconf"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "greycode configurator core: edits greyd's config.toml without the Tauri runtime"
license = "MIT"
publish = false

[dependencies]
# Only greyd::config::parse (validation) and greyd::control::socket_path are used.
greyd = { path = "../../host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same versions as greyd's tree: toml_edit keeps comments, key order and unknown keys.
toml = { version = "0.8", default-features = false, features = ["parse"] }
toml_edit = "0.22"
